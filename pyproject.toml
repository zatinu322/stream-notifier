[project]
name = "stream-notifier"
version = "1.0.0"
description = "Library for sending notifications to social medias."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "telegram-markdown-entities>=0.1.1",
    "tenacity>=9.2.1",
]

[tool.mypy]
disallow_untyped_defs = true  # Disallows defining functions without type annotations or with incomplete type annotations
python_version = 3.13
plugins = [
  "pydantic.mypy",
]

[[tool.mypy.overrides]]
module = [
    "httpx",
    "tenacity",
    "telegram_markdown",
    "pytest",
    "pydantic_settings",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]


[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
